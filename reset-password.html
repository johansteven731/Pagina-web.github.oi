
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | Costanera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fondo-formulario">

    <a href="index.html" class="logo-formulario">🐟 COSTANERA</a>

    <main class="caja-formulario">
        <h1>¿Olvidaste tu contraseña?</h1>

        <p class="descripcion-formulario">
            Escribe el correo electrónico asociado a tu cuenta
            para solicitar la recuperación de tu contraseña.
        </p>

        <form action="#" method="post">
            <div class="grupo-campo">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="tucorreo@ejemplo.com"
                    required>
            </div>

            <button type="submit" class="boton boton-formulario">
                Recuperar contraseña
            </button>
        </form>

        <div class="enlaces-formulario">
            <a href="login.html">Volver a iniciar sesión</a>
            <a href="registro.html">Crear una cuenta</a>
        </div>
    </main>

    <a href="index.html" class="volver-inicio">← Volver al inicio</a>

</body>
</html>
