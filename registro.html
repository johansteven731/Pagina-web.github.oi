
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Costanera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fondo-formulario">

    <a href="index.html" class="logo-formulario">🐟 COSTANERA</a>

    <main class="caja-formulario">
        <h1>Crear una cuenta</h1>
        <p class="descripcion-formulario">
            Regístrate para conocer nuestros productos.
        </p>

        <form action="#" method="post">
            <div class="grupo-campo">
                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre completo"
                    required>
            </div>

            <div class="grupo-campo">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="tucorreo@ejemplo.com"
                    required>
            </div>

            <div class="grupo-campo">
                <label for="telefono">Teléfono</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Tu número de teléfono"
                    required>
            </div>

            <div class="grupo-campo">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Crea una contraseña"
                    minlength="8"
                    required>
            </div>

            <div class="grupo-campo">
                <label for="confirmar">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    minlength="8"
                    required>
            </div>

            <button type="submit" class="boton boton-formulario">
                Crear cuenta
            </button>
        </form>

        <div class="enlaces-formulario">
            <p>¿Ya tienes una cuenta?</p>
            <a href="login.html">Iniciar sesión</a>
        </div>
    </main>

    <a href="index.html" class="volver-inicio">← Volver al inicio</a>

</body>
</html>
