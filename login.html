
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Costanera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fondo-formulario">

    <a href="index.html" class="logo-formulario">🐟 COSTANERA</a>

    <main class="caja-formulario">
        <h1>¡Bienvenido!</h1>
        <p class="descripcion-formulario">
            Inicia sesión para continuar en Costanera.
        </p>

        <form action="#" method="post">
            <div class="grupo-campo">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="tucorreo@ejemplo.com"
                    required>
            </div>

            <div class="grupo-campo">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required>
            </div>

            <div class="enlaces-formulario" style="margin-top: 0; margin-bottom: 20px;">
                <a href="reset-password.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="boton boton-formulario">
                Iniciar sesión
            </button>
        </form>

        <div class="enlaces-formulario">
            <p>¿Todavía no tienes una cuenta?</p>
            <a href="registro.html">Crear una cuenta</a>
        </div>
    </main>

    <a href="index.html" class="volver-inicio">← Volver al inicio</a>

</body>
</html>
